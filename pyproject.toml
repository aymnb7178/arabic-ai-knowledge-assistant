[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-ai-knowledge-assistant"
version = "0.1.0"
description = "Arabic/English document Q&A with TF-IDF + BM25 hybrid retrieval and cited extractive answers (no LLM required)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aymen Al Erwi" }]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "flask>=3.0", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
pdf = ["pypdf>=4.0"]

[project.scripts]
knowledge-assistant = "knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["knowledge_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
